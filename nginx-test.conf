user www-data;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Only the existing Cloudflared peer supplies a trusted visitor address.
  map $remote_addr $tunnel_visitor { default ""; 172.30.33.2 $http_cf_connecting_ip; }
  map $tunnel_visitor $visitor { "" $remote_addr; default $tunnel_visitor; }
  limit_req_zone $visitor zone=login_per_ip:10m rate=6r/m;
  limit_req_zone $server_name zone=login_server:1m rate=10r/s;
  server {
    listen 8099;
    server_name dziennik.romean5.pl;
    client_max_body_size 40m;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $visitor;
    proxy_set_header X-Forwarded-For $visitor;
    proxy_set_header CF-Connecting-IP $visitor;
    proxy_set_header Authorization "";
    proxy_cookie_flags worklog_session secure httponly samesite=lax;
    proxy_read_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location ~ ^/api/(auth|pin)/?$ {
      client_max_body_size 4k;
      limit_req zone=login_per_ip burst=6 nodelay;
      limit_req zone=login_server burst=20 nodelay;
      error_page 429 = @login_limit;
      add_header Cache-Control "no-store" always;
      proxy_pass http://127.0.0.1:3000;
    }
    location @login_limit {
      default_type application/json;
      add_header Retry-After 60 always;
      add_header Cache-Control "no-store" always;
      return 429 '{"error":"rate_limited","retryAfter":60}';
    }
    location /api/ {
      add_header Cache-Control "no-store" always;
      proxy_pass http://127.0.0.1:3000;
    }
    location / {
      proxy_pass http://127.0.0.1:3000;
    }
  }
}
